<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>评图工作台 · 窗贴 Sheet Workbench</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .review-shell { min-height: calc(100vh - 82px); display: grid; grid-template-columns: 360px minmax(0, 1fr); }
    .review-main { min-width: 0; padding: 22px 26px 60px; display: grid; gap: 18px; align-content: start; }
    .review-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 17px; border: 1px solid var(--line); border-radius: 14px; background: white; box-shadow: 0 8px 25px rgba(26, 62, 71, .05); }
    .review-toolbar small { color: var(--muted); }

    .review-card { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 18px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: white; box-shadow: 0 8px 25px rgba(26, 62, 71, .05); }
    .review-card .imgbox { display: grid; gap: 8px; align-content: start; }
    .review-card .imgbox a { display: block; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #f2f6f6; }
    .review-card .imgbox img.master { width: 100%; display: block; }
    .review-card .imgbox .src-row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .review-card .imgbox .src-row img { width: 52px; height: 52px; object-fit: contain; border: 1px solid var(--line); border-radius: 8px; background: white; }

    .review-meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; color: var(--muted); font-size: 12px; }
    .review-meta .chip { padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: #f6fafa; color: var(--ink); }
    .review-meta .chip.hash { font-family: Consolas, monospace; background: var(--mint); color: var(--teal-dark); border-color: #b9d9d6; }

    .anno-list { display: grid; gap: 8px; margin: 12px 0 4px; }
    .anno-item { display: grid; gap: 5px; padding: 9px 11px; border: 1px solid var(--line); border-left: 4px solid var(--amber); border-radius: 9px; background: #fbfdfd; }
    .anno-item.sev-low { border-left-color: #9db8bf; }
    .anno-item.sev-high { border-left-color: var(--coral); }
    .anno-item .anno-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
    .anno-item .anno-head .tag { padding: 2px 8px; border-radius: 999px; background: #eef3f4; color: var(--ink); }
    .anno-item .anno-note { white-space: pre-wrap; }
    .anno-item button.del { margin-left: auto; padding: 1px 8px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 7px; font-size: 11px; }
    .anno-item button.del:hover { color: var(--coral); border-color: var(--coral); }

    .anno-form { margin-top: 10px; padding: 12px; border: 1px dashed #b7cdd2; border-radius: 12px; background: #fafcfc; }
    .chk-row { display: flex; flex-wrap: wrap; gap: 6px; }
    label.chk { display: inline-flex; align-items: center; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: white; color: var(--muted); font-size: 12px; cursor: pointer; user-select: none; }
    label.chk input { display: none; }
    label.chk.on { color: var(--teal-dark); border-color: var(--teal); background: var(--mint); font-weight: 650; }
    .sev-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .sev-row button { padding: 4px 13px; border: 1px solid var(--line); border-radius: 999px; background: white; color: var(--muted); font-size: 12px; }
    .sev-row button.on { color: white; border-color: transparent; font-weight: 700; }
    .sev-row button.on[data-sev="low"] { background: #9db8bf; }
    .sev-row button.on[data-sev="medium"] { background: var(--amber); }
    .sev-row button.on[data-sev="high"] { background: var(--coral); }
    .anno-form textarea { min-height: 58px; margin-top: 10px; }
    .anno-form .form-foot { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
    .anno-form .form-foot small { color: var(--muted); }

    .prompt-pre { max-height: 300px; overflow: auto; padding: 10px; margin-top: 8px; border: 1px solid var(--line); border-radius: 9px; background: #f7fafa; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
    .defect-stat { display: flex; justify-content: space-between; gap: 8px; padding: 6px 9px; border-radius: 8px; font-size: 12px; }
    .defect-stat:nth-child(odd) { background: #f4f8f8; }
    .defect-stat b { color: var(--teal-dark); }
    .add-type-row { display: flex; gap: 7px; margin-top: 11px; }
    .add-type-row input { flex: 1; min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 8px; }
    .empty-hint { padding: 60px 20px; text-align: center; color: var(--muted); }
    @media (max-width: 1100px) { .review-card { grid-template-columns: 1fr; } .review-shell { grid-template-columns: 300px 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <span class="eyebrow">HUMAN REVIEW / PROMPT ITERATION</span>
      <h1>评图工作台</h1>
    </div>
    <div class="top-actions">
      <span id="anno-total" class="provider">加载中…</span>
      <button id="refresh" class="ghost">刷新</button>
      <a href="/" class="ghost">返回工作台</a>
    </div>
  </header>

  <div class="review-shell">
    <aside class="sidebar">
      <div class="panel-block">
        <div class="section-title"><span>01</span>缺陷类别</div>
        <div id="defect-stats"></div>
        <div class="add-type-row">
          <input id="new-type-label" type="text" placeholder="新增类别名称…">
          <button id="add-type" class="secondary">添加</button>
        </div>
      </div>
      <div class="panel-block">
        <div class="section-title"><span>02</span>当前默认生图 Prompt</div>
        <details open>
          <summary>展开 / 收起</summary>
          <pre id="default-prompt" class="prompt-pre"></pre>
        </details>
      </div>
      <div class="panel-block">
        <div class="section-title"><span>03</span>窗户模板硬约束</div>
        <div id="template-constraints"></div>
      </div>
    </aside>

    <main class="review-main">
      <div class="review-toolbar">
        <div><strong>生图母版评审</strong><small style="margin-left:10px">按时间倒序 · 只显示带生图阶段的任务</small></div>
        <small id="job-count"></small>
      </div>
      <div id="cards"></div>
      <div id="empty" class="empty-hint" hidden>还没有带生图母版的任务。先在工作台跑一批图吧。</div>
    </main>
  </div>

  <script src="/static/review.js"></script>
</body>
</html>
